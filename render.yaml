services:
  - type: web
    name: sih26137-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: QDFRO_ENVIRONMENT
        value: production
    healthCheckPath: /api/health
