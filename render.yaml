services:
  - type: web
    name: sih26137-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: QDFRO_ENVIRONMENT
        value: production
      - key: QDFRO_GEOCODE_TIMEOUT_S
        value: "15"
      - key: QDFRO_OVERPASS_TIMEOUT_S
        value: "20"
      - key: QDFRO_OVERPASS_ATTEMPTS
        value: "1"
      - key: QDFRO_OVERPASS_QUERY_TIMEOUT_S
        value: "120"
    healthCheckPath: /api/health
